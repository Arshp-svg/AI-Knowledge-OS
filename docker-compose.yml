services:
  # ======================================================
  # 1. Distributed Vector Database (Qdrant)
  # ======================================================
  qdrant:
    image: qdrant/qdrant:v1.16.1
    container_name: ai-knowledge-os-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rag_network

  # ======================================================
  # 2. FastAPI Retrieval & Inference Engine (Backend)
  # ======================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-knowledge-os-backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - ADMIN_API_KEY=${ADMIN_API_KEY:-demo-admin-key-2026}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - backend_storage:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - rag_network

  # ======================================================
  # 3. Next.js Streaming UI (Frontend)
  # ======================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: ai-knowledge-os-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - rag_network

# ========================================================
# Persistent Volumes & Private Network
# ========================================================
volumes:
  qdrant_data:
    name: ai_knowledge_os_qdrant_data
  backend_storage:
    name: ai_knowledge_os_backend_storage

networks:
  rag_network:
    name: ai_knowledge_os_network
    driver: bridge
